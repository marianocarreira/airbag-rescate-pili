<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#fbbf24" stroke-width="18"/>
  <!-- Lightning bolts -->
  <polygon points="95,90 140,90 115,155 155,155 85,250 105,170 75,170" fill="#fbbf24" stroke="#09090b" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="415,90 450,90 425,150 460,150 395,235 415,165 385,165" fill="#38bdf8" stroke="#09090b" stroke-width="8" stroke-linejoin="round"/>
  <!-- Cartoon Guitar Gibson Les Paul Goldtop -->
  <g transform="translate(256, 260) rotate(-32)">
    <!-- Neck -->
    <rect x="-18" y="-195" width="36" height="150" rx="6" fill="#78350f" stroke="#09090b" stroke-width="10"/>
    <rect x="-24" y="-235" width="48" height="46" rx="8" fill="#18181b" stroke="#09090b" stroke-width="10"/>
    <!-- Body -->
    <path d="M -68,-25 C -85,-25 -80,25 -55,40 C -92,65 -95,145 -35,160 C 0,168 0,168 35,160 C 95,145 92,65 55,40 C 80,25 85,-25 68,-25 C 45,-35 -45,-35 -68,-25 Z" fill="url(#gold)" stroke="#09090b" stroke-width="12"/>
    <!-- Pickups & Bridge -->
    <rect x="-28" y="15" width="56" height="24" rx="5" fill="#fef3c7" stroke="#09090b" stroke-width="8"/>
    <rect x="-28" y="55" width="56" height="24" rx="5" fill="#fef3c7" stroke="#09090b" stroke-width="8"/>
    <rect x="-32" y="98" width="64" height="12" rx="4" fill="#e2e8f0" stroke="#09090b" stroke-width="6"/>
    <!-- Strings -->
    <line x1="-8" y1="-190" x2="-8" y2="100" stroke="#fef08a" stroke-width="3"/>
    <line x1="0" y1="-190" x2="0" y2="100" stroke="#fef08a" stroke-width="3"/>
    <line x1="8" y1="-190" x2="8" y2="100" stroke="#fef08a" stroke-width="3"/>
  </g>
  <!-- Red Airbag Banner -->
  <g transform="translate(256, 405) rotate(-3)">
    <rect x="-195" y="-48" width="390" height="86" rx="22" fill="url(#red)" stroke="#09090b" stroke-width="12"/>
    <text x="0" y="16" font-family="Impact, Arial Black, sans-serif" font-size="68" font-weight="900" fill="#ffffff" stroke="#09090b" stroke-width="8" paint-order="stroke" text-anchor="middle" letter-spacing="4">AIRBAG</text>
  </g>
</svg>
