<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIRBAG: EL RESCATE DE PILI - Edición HD Cómic Ilustrado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
      color: #f8fafc;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    .loud-font {
      font-family: 'Bangers', cursive;
      letter-spacing: 1.5px;
    }
    .comic-panel {
      background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
      border: 3px solid #f59e0b;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .comic-btn {
      border: 2px solid #09090b;
      box-shadow: 3px 3px 0px #09090b;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
    }
    .comic-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #09090b;
      filter: brightness(1.08);
    }
    .comic-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #09090b;
    }
    canvas {
      border: 4px solid #fbbf24;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 25px rgba(245, 158, 11, 0.25);
      border-radius: 14px;
      background: #09090b;
      cursor: pointer;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

  <!-- BARRA SUPERIOR CON REPRODUCTOR DE AIRBAG Y MP3 POR DEFECTO DEL SITIO -->
  <header class="w-full max-w-6xl comic-panel rounded-2xl p-2.5 mb-2.5 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-b from-red-500 to-red-700 text-white loud-font text-2xl sm:text-3xl px-4 py-0.5 rounded-lg border-2 border-amber-300 shadow-[3px_3px_0px_#000] -rotate-1">
        AIRBAG
      </div>
      <div>

          EL RESCATE DE PILI • EDICIÓN HD CEL-SHADED
        </h1>
        <p class="text-[11px] text-slate-300 font-bold">Pato (Les Paul + Mic) vs. Guido (Recital) &amp; Gastón (Bulls #31)</p>

    <!-- Reproductor con MP3 del Sitio por defecto + Volumen + Selector -->
    <div class="flex flex-wrap items-center gap-2 bg-zinc-900/90 px-3 py-1.5 rounded-xl border-2 border-zinc-700">
      <span class="text-xs text-amber-400 font-extrabold">🎸 MÚSICA:</span>
      <select id="songSelector" class="bg-zinc-800 text-white text-xs font-bold px-2.5 py-1 rounded-lg border border-amber-500/60 focus:outline-none cursor-pointer">
        <option value="hosted_mp3" selected>💿 MP3 del Sitio (Por Defecto)</option>
        <option value="por_mil_noches">🎵 Por Mil Noches (Rock Synth)</option>
        <option value="cae_el_sol">🎵 Cae el Sol (Rock Synth)</option>
        <option value="solo_aqui">🎵 Solo Aquí (Rock Synth)</option>

      <button id="playPauseMusicBtn" class="comic-btn bg-emerald-500 text-black font-black text-xs px-2.5 py-1 rounded-lg cursor-pointer">

      <div class="flex items-center gap-1 bg-zinc-800 px-2 py-1 rounded-lg border border-zinc-600" title="Volumen de Música">

  <!-- LIENZO PRINCIPAL DEL JUEGO (1280x720 HD CEL-SHADED) -->

    <!-- Panel Inferior de Controles y Atajos de Nivel -->
    <div class="w-full mt-2.5 comic-panel rounded-2xl p-2.5 flex flex-wrap items-center justify-between gap-2 text-xs">

    <!-- Controles Táctiles en Pantalla -->
    <div class="w-full mt-2.5 grid grid-cols-2 gap-3 lg:hidden">
      <div class="flex items-center gap-2">
        <button id="tLeft" class="comic-btn w-12 h-12 bg-zinc-800 text-white font-black rounded-xl text-lg">◀</button>
        <div class="flex flex-col gap-1">
          <button id="tUp" class="comic-btn w-12 h-10 bg-zinc-800 text-white font-black rounded-xl text-sm">▲</button>
          <button id="tDown" class="comic-btn w-12 h-10 bg-zinc-800 text-white font-black rounded-xl text-sm">▼</button>
        </div>
        <button id="tRight" class="comic-btn w-12 h-12 bg-zinc-800 text-white font-black rounded-xl text-lg">▶</button>
        <button id="tJump" class="comic-btn px-3 h-12 bg-emerald-500 text-black font-black rounded-xl text-xs">SALTAR</button>
      </div>
      <div class="flex items-center justify-end gap-2">
        <button id="tGuitar" class="comic-btn px-3 h-12 bg-amber-400 text-black font-black rounded-xl text-xs flex flex-col items-center justify-center">
          <span>🎸 J</span>
          <span class="text-[9px]">LES PAUL</span>
        </button>
        <button id="tMic" class="comic-btn px-3 h-12 bg-fuchsia-400 text-black font-black rounded-xl text-xs flex flex-col items-center justify-center">
          <span>🎤 K</span>
          <span class="text-[9px]">MICRÓFONO</span>
        </button>
        <button id="tSpecial" class="comic-btn px-3 h-12 bg-cyan-400 text-black font-black rounded-xl text-xs flex flex-col items-center justify-center">
          <span>⚡ L</span>
          <span class="text-[9px]">ACOPLE</span>
        </button>
      </div>
    </div>
  </main>

  <!-- ELEMENTO DE AUDIO PRINCIPAL PARA EL MP3 ALOJADO EN EL SITIO -->
  <audio id="bgMusic" loop preload="auto" class="hidden">
    <source src="airbag.mp3" type="audio/mpeg">
    <source src="music.mp3" type="audio/mpeg">
    <source src="song.mp3" type="audio/mpeg">
    <source src="tema.mp3" type="audio/mpeg">
  </audio>

  <script>
    const DEFAULT_MP3_FILE = "airbag.mp3";
    const CANDIDATE_MP3_FILES = [
      DEFAULT_MP3_FILE,
      "music.mp3",
      "song.mp3",
      "tema.mp3",
      "audio.mp3",
      "bso.mp3",
      "track.mp3",
      "por_mil_noches.mp3",
      "cae_el_sol.mp3",
      "musica.mp3"
    ];

    class AirbagAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = true;
        this.usingCustomMP3 = true;
        this.mp3Ready = false;
        this.currentSong = 'hosted_mp3';
        this.step = 0;
        this.timer = null;
        this.audioEl = document.getElementById('bgMusic');
        this.audioEl.volume = 0.85;
        this.hostedMp3Url = null;
        this.hostedMp3Name = DEFAULT_MP3_FILE;

        this.songs = {
          por_mil_noches: {
            tempo: 150,
            bass: [110, 110, 87.31, 87.31, 130.81, 130.81, 98.00, 98.00],
            lead: [440, 523.25, 659.25, 587.33, 523.25, 440, 392.00, 440, 523.25, 659.25, 783.99, 659.25, 587.33, 523.25, 493.88, 440]
          },
          cae_el_sol: {
            tempo: 145,
            bass: [130.81, 130.81, 98.00, 98.00, 110.00, 110.00, 87.31, 87.31],
            lead: [523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 523.25, 392.00, 440.00, 523.25, 659.25, 523.25, 493.88, 440.00, 392.00, 329.63]
          },
          solo_aqui: {
            tempo: 160,
            bass: [146.83, 146.83, 110.00, 110.00, 123.47, 123.47, 98.00, 98.00],
            lead: [587.33, 739.99, 880.00, 739.99, 659.25, 587.33, 554.37, 440.00, 493.88, 587.33, 739.99, 659.25, 587.33, 493.88, 440.00, 392.00]
          },
          huracan: {
            tempo: 125,
            bass: [82.41, 82.41, 98.00, 110.00, 82.41, 82.41, 123.47, 110.00],
            lead: [329.63, 329.63, 392.00, 440.00, 493.88, 440.00, 392.00, 329.63, 659.25, 587.33, 493.88, 440.00, 392.00, 440.00, 329.63, 329.63]
          }
        };

        this.discoverDefaultMP3();
      }

      updateTrackBadge(text) {
        const label = document.getElementById('customTrackName');
        if (label) {
          label.textContent = text;
          label.classList.remove('hidden');
        }
      }

      async discoverDefaultMP3() {
        try {
          const host = window.location.hostname;
          if (host.endsWith('github.io')) {
            const owner = host.split('.')[0];
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
            const subDirs = pathParts.slice(1);
            if (subDirs.length && subDirs[subDirs.length - 1].includes('.')) {
              subDirs.pop();
            }
            const folderPath = subDirs.join('/');
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`;
            const resp = await fetch(apiUrl);
            if (resp.ok) {
              const items = await resp.json();
              if (Array.isArray(items)) {
                const mp3Item = items.find(item => item.type === 'file' && item.name.toLowerCase().endsWith('.mp3'));
                if (mp3Item) {
                  this.setHostedMP3(mp3Item.name, mp3Item.name);
                  return;
                }
              }
            }
          }
        } catch (err) {}

        for (const candidate of CANDIDATE_MP3_FILES) {
          const found = await this.probeAudioFile(candidate);
          if (found) {
            this.setHostedMP3(candidate, candidate);
            return;
          }
        }

        this.setHostedMP3(DEFAULT_MP3_FILE, DEFAULT_MP3_FILE, true);
      }

      probeAudioFile(url) {
        return new Promise((resolve) => {
          const testAudio = new Audio();
          let settled = false;
          const finish = (ok) => {
            if (!settled) {
              settled = true;
              testAudio.src = '';
              resolve(ok);
            }
          };
          const timeout = setTimeout(() => finish(false), 1800);
          testAudio.addEventListener('loadedmetadata', () => {
            clearTimeout(timeout);
            finish(true);
          }, { once: true });
          testAudio.addEventListener('canplaythrough', () => {
            clearTimeout(timeout);
            finish(true);
          }, { once: true });
          testAudio.addEventListener('error', () => {
            clearTimeout(timeout);
            finish(false);
          }, { once: true });
          testAudio.preload = 'metadata';
          testAudio.src = url;
        });
      }

      setHostedMP3(url, displayName, isUnverifiedFallback = false) {
        this.hostedMp3Url = url;
        this.hostedMp3Name = displayName;
        this.audioEl.src = url;
        this.mp3Ready = true;
        this.usingCustomMP3 = (this.currentSong === 'hosted_mp3');

        this.audioEl.onerror = () => {
          if (this.currentSong === 'hosted_mp3') {
            this.mp3Ready = false;
            this.usingCustomMP3 = false;
            this.updateTrackBadge('🎸 Synth Activo (Subí ' + DEFAULT_MP3_FILE + ')');
          }
        };

        this.audioEl.onloadeddata = () => {
          this.mp3Ready = true;
          this.usingCustomMP3 = (this.currentSong === 'hosted_mp3');
          this.updateTrackBadge('💿 ' + displayName);
          if (this.isPlaying && this.usingCustomMP3) {
            this.audioEl.play().catch(() => {});
          }
        };

        if (!isUnverifiedFallback) {
          this.updateTrackBadge('💿 ' + displayName);
        } else {
          this.updateTrackBadge('💿 ' + displayName + ' (Por Defecto)');
        }

        if (this.isPlaying && this.usingCustomMP3) {
          this.audioEl.play().catch(() => {});
        }
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.startLoop();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        if (this.isPlaying && this.usingCustomMP3 && this.audioEl.paused) {
          this.audioEl.play().catch(() => {});
        }
      }

      setVolume(val) {
        this.audioEl.volume = Math.max(0, Math.min(1, parseFloat(val) || 0.85));
      }

      setSong(key) {
        this.currentSong = key;
        this.step = 0;
        if (key === 'hosted_mp3') {
          this.usingCustomMP3 = true;
          if (this.hostedMp3Url && !this.audioEl.src.endsWith(this.hostedMp3Url)) {
            this.audioEl.src = this.hostedMp3Url;
          }
          this.updateTrackBadge('💿 ' + this.hostedMp3Name);
          if (this.isPlaying) {
            this.audioEl.play().catch(() => {});
          }
        } else {
          this.audioEl.pause();
          this.usingCustomMP3 = false;
          this.updateTrackBadge('🎸 Synth: ' + key.replace(/_/g, ' '));
          this.startLoop();
        }
      }

      loadMP3(files) {
        if (!files || !files.length) return;
        const file = files[0];
        const blobUrl = URL.createObjectURL(file);
        this.hostedMp3Url = blobUrl;
        this.hostedMp3Name = file.name;
        this.audioEl.src = blobUrl;
        this.mp3Ready = true;
        this.usingCustomMP3 = true;
        this.currentSong = 'hosted_mp3';
        const selector = document.getElementById('songSelector');
        if (selector) selector.value = 'hosted_mp3';
        if (this.isPlaying) this.audioEl.play().catch(() => {});
        this.updateTrackBadge('💿 ' + file.name);
      }

      toggle() {
        this.init();
        this.isPlaying = !this.isPlaying;
        const btn = document.getElementById('playPauseMusicBtn');
        if (this.isPlaying) {
          btn.textContent = '🔊 MÚSICA ON';
          btn.className = 'comic-btn bg-emerald-500 text-black font-black text-xs px-2.5 py-1 rounded-lg cursor-pointer';
          if (this.usingCustomMP3) this.audioEl.play().catch(() => {});
        } else {
          btn.textContent = '🔇 MÚSICA OFF';
          btn.className = 'comic-btn bg-zinc-600 text-white font-black text-xs px-2.5 py-1 rounded-lg cursor-pointer';
          if (this.usingCustomMP3) this.audioEl.pause();
        }
      }

      startLoop() {
        if (this.timer) clearInterval(this.timer);
        const s = this.songs[this.currentSong] || this.songs.por_mil_noches;
        this.timer = setInterval(() => {
          const mp3ActuallyPlaying = this.usingCustomMP3 && !this.audioEl.paused && !this.audioEl.ended && this.audioEl.readyState >= 2;
          if (!this.isPlaying || mp3ActuallyPlaying || !this.ctx || gameState !== 'PLAYING') return;
          const b = s.bass[Math.floor(this.step / 2) % s.bass.length];
          const l = s.lead[this.step % s.lead.length];
          this.tone(b, 'sawtooth', 0.13, 0.055, b);
          if (this.step % 2 === 0 || Math.random() > 0.25) {
            this.tone(l, 'square', 0.12, 0.04, l * 1.004);
          }
          if (this.step % 4 === 0) this.tone(75, 'sine', 0.09, 0.12, 32);
          if (this.step % 4 === 2) this.noise(0.07, 0.05);
          this.step++;
        }, s.tempo);
      }

      tone(freq, type, dur, vol, endFreq = null) {
        if (!this.ctx || !this.isPlaying) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + dur);
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      }

      noise(dur, vol) {
        if (!this.ctx || !this.isPlaying) return;
        try {
          const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(vol, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          src.connect(g);
          g.connect(this.ctx.destination);
          src.start();
        } catch (e) {}
      }

      sfxGuitar() {
        this.init();
        const roots = [261.63, 293.66, 329.63, 392.00, 440.00];
        const r = roots[Math.floor(Math.random() * roots.length)];
        this.tone(r, 'sawtooth', 0.22, 0.08, r * 1.02);
        this.tone(r * 1.5, 'sawtooth', 0.22, 0.06, r * 1.52);
        this.tone(r * 2, 'square', 0.24, 0.04, r * 2.04);
      }

      sfxMic() {
        this.init();
        this.tone(240, 'triangle', 0.2, 0.14, 80);
        this.noise(0.14, 0.1);
      }

      sfxSpecial() {
        this.init();
        [440, 554.37, 659.25, 880, 1108.73].forEach((n, i) => {
          setTimeout(() => {
            this.tone(n, 'sawtooth', 0.2, 0.09, n * 1.1);
            this.tone(n * 0.5, 'square', 0.2, 0.07);
          }, i * 55);
        });
      }

      sfxWin() {
        [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
          setTimeout(() => this.tone(n, 'sawtooth', 0.4, 0.1), i * 120);
        });
      }
    }

    const audio = new AirbagAudioEngine();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const W = 1280;
    const H = 720;
    const FLOOR_TOP = 470;
    const FLOOR_BOTTOM = 690;

    function drawRealisticComicHead(ctx, opts = {}) {
      const {
        skinBase = '#f6cba3',
        skinShadow = '#dca273',
        hasBeard = false,
        beardStyle = 'pato',
        sunglasses = false,
        mouthOpen = false,
        smile = true,
        eyebrowSlit = false,
        isChild = false
      } = opts;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (!isChild) {
        ctx.fillStyle = skinShadow;
        ctx.strokeStyle = '#09090b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(-10, 12, 18, 18, 4);
        ctx.fill();
        ctx.stroke();
      }

      const headGrad = ctx.createLinearGradient(-20, -32, 22, 24);
      headGrad.addColorStop(0, '#ffe0c2');
      headGrad.addColorStop(0.6, skinBase);
      headGrad.addColorStop(1, skinShadow);

      ctx.fillStyle = headGrad;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3.2;

      ctx.beginPath();
      if (isChild) {
        ctx.moveTo(-20, -22);
        ctx.bezierCurveTo(-23, -2, -20, 16, 0, 20);
        ctx.bezierCurveTo(20, 16, 23, -2, 20, -22);
        ctx.bezierCurveTo(14, -34, -14, -34, -20, -22);
      } else {
        ctx.moveTo(-21, -26);
        ctx.lineTo(-22, -4);
        ctx.quadraticCurveTo(-21, 14, -8, 22);
        ctx.lineTo(6, 23);
        ctx.quadraticCurveTo(20, 16, 22, 0);
        ctx.lineTo(21, -24);
        ctx.bezierCurveTo(15, -36, -15, -36, -21, -26);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(180, 105, 60, 0.28)';
      ctx.beginPath();

          maxHp: 300,
          attackTimer: 50,
          facingRight: false,
          defeated: false,
          anim: 0
        };
        pili = {
          x: stageLength + 600,
          y: 570,
          tied: true,
          rescued: false
        };
      }
    }

    function shootGuitarChord() {
      if (pato.guitarCD > 0) return;
      pato.guitarCD = 13;
      pato.guitarStrumAnim = 12;
      audio.sfxGuitar();

      const dir = pato.facingRight ? 1 : -1;
      const notes = ['*DO', 'SOL', '𝄞', '♪', 'SOL#', '♫'];
      const note = notes[Math.floor(Math.random() * notes.length)];
      const cols = ['#fde047', '#38bdf8', '#f472b6', '#4ade80'];

      projectiles.push({
        owner: 'pato',
        kind: 'note',
        x: pato.x + dir * 58,
        y: pato.y,
        z: pato.z + 64,
        vx: dir * 12.5,
        vy: (Math.random() - 0.5) * 1.4,
        label: note,
        color: cols[Math.floor(Math.random() * cols.length)],
        damage: 20,
        life: 75
      });

      spawnComicPop(pato.x + dir * 48, pato.y - pato.z - 64, note, '#fde047');
    }

    function swingMicStand() {
      if (pato.micCD > 0) return;
      pato.micCD = 22;
      pato.micSwingAnim = 16;
      audio.sfxMic();

      const dir = pato.facingRight ? 1 : -1;
      projectiles.push({
        owner: 'pato',
        kind: 'mic_wave',
        x: pato.x + dir * 68,
        y: pato.y,
        z: pato.z + 64,
        vx: dir * 13.5,
        vy: 0,
        label: '((( FEEDBACK )))',
        color: '#e879f9',
        damage: 32,
        life: 36
      });

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (p.owner === 'boss' && Math.hypot(p.x - (pato.x + dir * 55), p.y - pato.y) < 130) {
          projectiles.splice(i, 1);
        }
      }
      spawnComicPop(pato.x + dir * 68, pato.y - pato.z - 68, '¡MIC BLAST!', '#f472b6');
    }

    function unleashSupremeFeedback() {
      if (pato.energy < 30 || pato.guitarCD > 0) return;
      pato.energy -= 30;
      pato.guitarCD = 22;
      pato.guitarStrumAnim = 20;
      audio.sfxSpecial();

      const labels = ['*DO', 'SOL', '𝄞', '♫', 'SOL', '*DO'];
      labels.forEach((lbl, idx) => {
        const ang = (idx / labels.length) * Math.PI * 2;
        projectiles.push({
          owner: 'pato',
          kind: 'note',
          x: pato.x,
          y: pato.y,
          z: pato.z + 62,
          vx: Math.cos(ang) * 10.5,
          vy: Math.sin(ang) * 4.5,
          label: lbl,
          color: '#38bdf8',
          damage: 35,
          life: 60
        });
      });
      spawnComicPop(pato.x, pato.y - 125, '¡SUPER ACOPLE 360°!', '#38bdf8');
    }

    function spawnComicPop(x, y, text, color) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -1.8,
        text,
        color,
        life: 38
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;
      gameTimer++;

      if (pato.energy < pato.maxEnergy) pato.energy += 0.14;
      if (pato.guitarCD > 0) pato.guitarCD--;
      if (pato.micCD > 0) pato.micCD--;
      if (pato.guitarStrumAnim > 0) pato.guitarStrumAnim--;
      if (pato.micSwingAnim > 0) pato.micSwingAnim--;
      if (pato.invuln > 0) pato.invuln--;

      pato.vx = 0;
      pato.vy = 0;
      if (keys.left) { pato.vx = -pato.speedX; pato.facingRight = false; }
      if (keys.right) { pato.vx = pato.speedX; pato.facingRight = true; }
      if (keys.up) pato.vy = -pato.speedY;
      if (keys.down) pato.vy = pato.speedY;

      if (pato.vx !== 0 || pato.vy !== 0) pato.walkCycle++;

      if (keys.jump && pato.z === 0) {
        pato.vz = 15.5;
        audio.tone(280, 'sine', 0.12, 0.08, 520);
      }

      pato.z += pato.vz;
      if (pato.z > 0) pato.vz -= 0.85;
      else { pato.z = 0; pato.vz = 0; }

      pato.x += pato.vx;
      pato.y += pato.vy;

      if (pato.y < FLOOR_TOP + 15) pato.y = FLOOR_TOP + 15;
      if (pato.y > FLOOR_BOTTOM) pato.y = FLOOR_BOTTOM;
      if (pato.x < cameraX + 55) pato.x = cameraX + 55;
      const maxX = stageLength + 700;
      if (pato.x > maxX) pato.x = maxX;

      if ((keys.guitar && keys.mic) || keys.special) {
        unleashSupremeFeedback();
      } else {
        if (keys.guitar) shootGuitarChord();
        if (keys.mic) swingMicStand();
      }

      const targetCam = pato.x - 340;
      if (targetCam > cameraX && cameraX < stageLength - 320) {
        cameraX += (targetCam - cameraX) * 0.1;
      }

      for (let f of fans) {
        if (!f.pacified) {
          f.anim++;
          const dx = pato.x - f.x;
          const dy = pato.y - f.y;
          const dist = Math.hypot(dx, dy);
          f.facingRight = dx > 0;
          if (dist < 600 && dist > 38) {
            f.x += (dx / dist) * 1.85;
            f.y += (dy / dist) * 1.15;
          } else if (dist <= 38 && pato.invuln <= 0 && pato.z < 25) {
            pato.hp -= 4;
            pato.invuln = 35;
            spawnComicPop(pato.x, pato.y - 110, '¡ABRAZO DE FAN!', '#f472b6');
            if (pato.hp <= 0) { pato.hp = 0; gameState = 'GAMEOVER'; }
          }
        }
      }

      if (boss && !boss.defeated) {
        boss.anim++;
        boss.facingRight = pato.x > boss.x;

        if (boss.z > 0 || boss.vz !== 0) {
          boss.z += boss.vz;
          boss.x += boss.vx;
          boss.y += boss.vy;
          boss.vz -= 0.75;
          if (boss.z <= 0) {
            boss.z = 0; boss.vz = 0; boss.vx = 0; boss.vy = 0;
            audio.noise(0.16, 0.14);
          }
        }

        if (Math.abs(pato.x - boss.x) < 820) {
          boss.attackTimer--;
          if (boss.attackTimer <= 0) {
            if (boss.id === 'guido') {
              boss.attackTimer = 54;
              ['𝄞', '♫', 'DO#'].forEach((sym, idx) => {
                projectiles.push({
                  owner: 'boss',
                  kind: 'piano_note',
                  x: boss.x - 45,
                  y: boss.y + (idx - 1) * 32,
                  z: 58,
                  vx: -8.5,
                  vy: (idx - 1) * 1.2,
                  label: sym,
                  color: '#c084fc',
                  damage: 9,
                  life: 95
                });
              });
              audio.tone(392, 'square', 0.14, 0.07, 523.25);
            } else {
              boss.attackTimer = 56;
              if (Math.random() < 0.62) {
                const ang = Math.atan2(pato.y - boss.y, pato.x - boss.x);
                projectiles.push({
                  owner: 'boss',
                  kind: 'thrown_mic',
                  x: boss.x - 20,
                  y: boss.y,
                  z: 68,
                  vx: Math.cos(ang) * 9.5,
                  vy: Math.sin(ang) * 4.5,
                  label: '🎤',
                  color: '#ef4444',
                  damage: 11,
                  life: 90
                });
                audio.tone(300, 'triangle', 0.16, 0.09, 140);
              } else {
                boss.vz = 15.5;
                boss.vx = (pato.x < boss.x ? -1 : 1) * 4.5;
                boss.vy = (pato.y - boss.y) * 0.04;
                spawnComicPop(boss.x, boss.y - 135, '¡STAGE DIVE!', '#ef4444');
              }
            }
          }
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.owner === 'pato') {
          for (let f of fans) {
            if (!f.pacified && Math.abs(p.x - f.x) < 42 && Math.abs(p.y - f.y) < 36) {
              f.hp -= p.damage;
              p.life = 0;
              pato.energy = Math.min(pato.maxEnergy, pato.energy + 5);
              if (f.hp <= 0) {
                f.pacified = true;
                score += 250;
                spawnComicPop(f.x, f.y - 95, '¡ROCK!', '#4ade80');
              }
              break;
            }
          }

          if (boss && !boss.defeated && Math.abs(p.x - boss.x) < 58 && Math.abs(p.y - boss.y) < 48) {
            boss.hp -= p.damage;
            p.life = 0;
            score += 150;
            spawnComicPop(boss.x, boss.y - 125, '¡RIFF! -' + p.damage, '#fde047');

            if (boss.hp <= 0) {
              boss.hp = 0;
              boss.defeated = true;
              score += 2500;
              audio.sfxWin();
              if (currentStage === 1) {
                spawnComicPop(boss.x, boss.y - 150, '¡GUIDO VENCIDO! A LA CALLE...', '#4ade80');
                setTimeout(() => initStage(2), 2400);
              } else {
                spawnComicPop(boss.x, boss.y - 150, '¡GASTÓN VENCIDO! ¡ACERCATE A PILI!', '#4ade80');
              }
            }
          }
        } else if (p.owner === 'boss' && pato.invuln <= 0) {
          if (Math.abs(p.x - pato.x) < 36 && Math.abs(p.y - pato.y) < 32 && pato.z < 45) {
            pato.hp -= p.damage;
            pato.invuln = 35;
            p.life = 0;
            spawnComicPop(pato.x, pato.y - 105, '¡OUCH!', '#ef4444');
            if (pato.hp <= 0) { pato.hp = 0; gameState = 'GAMEOVER'; }
          }
        }

        if (p.life <= 0) projectiles.splice(i, 1);
      }

      if (currentStage === 2 && pili && boss && boss.defeated && pili.tied) {
        if (Math.hypot(pato.x - pili.x, pato.y - pili.y) < 95) {
          pili.tied = false;
          pili.rescued = true;
          score += 5000;
          audio.sfxWin();
          setTimeout(() => { gameState = 'VICTORY'; }, 1800);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
      }
    }

    function drawProjectileHD(p) {
      ctx.save();
      const sy = p.y - p.z;

      if (p.kind === 'thrown_mic') {
        ctx.strokeStyle = '#09090b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(p.x, sy);
        ctx.bezierCurveTo(p.x + 28, sy - 24, p.x + 55, sy + 22, p.x + 88, sy - 4);
        ctx.stroke();

        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.roundRect(p.x - 8, sy - 5, 22, 10, 4);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(p.x - 10, sy, 9.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';
        ctx.lineWidth = 1.8;
        for (let line = -8; line <= 8; line += 4) {
          ctx.beginPath();
          ctx.moveTo(p.x - 36, sy + line);
          ctx.quadraticCurveTo(p.x - 18, sy + line - 4, p.x, sy + line);
          ctx.stroke();
        }

        ctx.font = '32px "Bangers"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#09090b';
        ctx.lineWidth = 5;
        ctx.strokeText(p.label, p.x, sy + 8);
        ctx.fillStyle = p.color;
        ctx.fillText(p.label, p.x, sy + 8);
      }
      ctx.restore();
    }

        ctx.roundRect(W - 426, 40, 320, 22, 6);
        ctx.fill();
        ctx.stroke();

        const bw = Math.max(0, (boss.hp / boss.maxHp) * 314);
        const bossGrad = ctx.createLinearGradient(W - 426, 42, W - 106, 42);
        bossGrad.addColorStop(0, '#f97316');
        bossGrad.addColorStop(1, '#dc2626');
        ctx.fillStyle = bossGrad;
        ctx.beginPath();
        ctx.roundRect(W - 109 - bw, 43, bw, 16, 4);
        ctx.fill();

        ctx.font = '800 10px "Montserrat"';
        ctx.fillStyle = '#fda4af';
        ctx.fillText(boss.subtitle, W - 108, 80);
      }

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);

      if (gameState === 'TITLE') {
        drawTitleScreenHD();
        return;
      }

      ctx.save();
      ctx.translate(-Math.floor(cameraX), 0);

      if (currentStage === 1) drawStage1ConcertHD();
      else drawStage2StreetHD();

      const drawables = [];
      drawables.push({ y: pato.y, fn: () => drawPatoHD(pato) });
      for (let f of fans) drawables.push({ y: f.y, fn: () => drawFanHD(f) });
      if (boss) {
        drawables.push({
          y: boss.y,
          fn: () => boss.id === 'guido' ? drawGuidoHD(boss) : drawGastonHD(boss)
        });
      }
      if (pili) drawables.push({ y: pili.y, fn: () => drawPiliHD(pili) });

      drawables.sort((a, b) => a.y - b.y);
      for (let d of drawables) d.fn();

      for (let p of projectiles) drawProjectileHD(p);

      for (let pt of particles) {
        ctx.font = '26px "Bangers"';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#09090b';
        ctx.lineWidth = 4;
        ctx.strokeText(pt.text, pt.x, pt.y);
        ctx.fillStyle = pt.color;
        ctx.fillText(pt.text, pt.x, pt.y);
      }

      ctx.restore();

      drawHUDHD();

      if (gameState === 'VICTORY') drawVictoryScreenHD();
      else if (gameState === 'GAMEOVER') drawGameOverHD();
    }

    function startGame(stage = 1) {
      audio.init();
      score = 0;
      gameTimer = 0;
      gameState = 'PLAYING';
      initStage(stage);
    }

    window.addEventListener('pointerdown', () => {
      audio.init();
    }, { once: true });

    window.addEventListener('keydown', (e) => {
      audio.init();
      if (gameState !== 'PLAYING') {
        if ([' ', 'j', 'J', 'Enter'].includes(e.key)) {
          e.preventDefault();
          startGame(1);
        }
        return;
      }
      switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': keys.left = true; break;
        case 'ArrowRight': case 'd': case 'D': keys.right = true; break;
        case 'ArrowUp': case 'w': case 'W': keys.up = true; break;
        case 'ArrowDown': case 's': case 'S': keys.down = true; break;
        case ' ': e.preventDefault(); keys.jump = true; break;
        case 'j': case 'J': case 'z': case 'Z': keys.guitar = true; break;
        case 'k': case 'K': case 'x': case 'X': keys.mic = true; break;
        case 'l': case 'L': case 'c': case 'C': keys.special = true; break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
        case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
        case 'ArrowUp': case 'w': case 'W': keys.up = false; break;
        case 'ArrowDown': case 's': case 'S': keys.down = false; break;
        case ' ': keys.jump = false; break;
        case 'j': case 'J': case 'z': case 'Z': keys.guitar = false; break;
        case 'k': case 'K': case 'x': case 'X': keys.mic = false; break;
        case 'l': case 'L': case 'c': case 'C': keys.special = false; break;
      }
    });

    canvas.addEventListener('pointerdown', () => {
      if (gameState !== 'PLAYING') startGame(1);
    });

    document.getElementById('songSelector').addEventListener('change', (e) => {
      audio.init();
      audio.setSong(e.target.value);
    });

    document.getElementById('playPauseMusicBtn').addEventListener('click', () => {
      audio.toggle();
    });

    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      audio.setVolume(e.target.value);
    });

    document.getElementById('mp3Uploader').addEventListener('change', (e) => {
      audio.init();
      audio.loadMP3(e.target.files);
    });

    document.getElementById('btnStage1').addEventListener('click', () => startGame(1));
    document.getElementById('btnStage2').addEventListener('click', () => startGame(2));
    document.getElementById('btnBossNow').addEventListener('click', () => {
      if (gameState !== 'PLAYING') startGame(currentStage);
      pato.x = stageLength + 60;
      cameraX = stageLength - 320;
    });

    function bindTouch(id, k) {
      const el = document.getElementById(id);
      if (!el) return;
      const on = (e) => { e.preventDefault(); if (gameState !== 'PLAYING') startGame(1); keys[k] = true; };
      const off = (e) => { e.preventDefault(); keys[k] = false; };
      el.addEventListener('touchstart', on);
      el.addEventListener('touchend', off);
      el.addEventListener('mousedown', on);
      el.addEventListener('mouseup', off);
      el.addEventListener('mouseleave', off);
    }

    bindTouch('tLeft', 'left');
    bindTouch('tRight', 'right');
    bindTouch('tUp', 'up');
    bindTouch('tDown', 'down');
    bindTouch('tJump', 'jump');
    bindTouch('tGuitar', 'guitar');
    bindTouch('tMic', 'mic');
    bindTouch('tSpecial', 'special');

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.onload = () => loop();
  </script>
</body>
</html>
